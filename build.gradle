plugins {
    id "java-library"
    id "net.neoforged.moddev" version "${moddev_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.blamejared.com" }
}

sourceSets {
    qaObserver {
        java.srcDirs = ['scripts/qa/neoforge/observer/src/main/java']
        resources.srcDirs = ['scripts/qa/neoforge/observer/src/main/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('qaObserverJar', Jar) {
    archiveBaseName = 'aura-neoforge-qa-observer'
    archiveVersion = '1.0.0'
    destinationDirectory = layout.buildDirectory.dir('qa-tools')
    from sourceSets.qaObserver.output
}

['Multiplayer': 'multiplayer', 'Ui': 'ui', 'Energy': 'energy', 'Persistence': 'persistence'].each { suffix, directory ->
    def qaSources = sourceSets.create("qa${suffix}") {
        java.srcDirs = ["scripts/qa/neoforge/${directory}/src/main/java"]
        resources.srcDirs = ["scripts/qa/neoforge/${directory}/src/main/resources"]
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    tasks.register("qa${suffix}Jar", Jar) {
        archiveBaseName = "aura-neoforge-qa-${directory}"
        archiveVersion = '1.0.0'
        destinationDirectory = layout.buildDirectory.dir('qa-tools')
        from qaSources.output
    }
}

dependencies {
    implementation "vazkii.patchouli:Patchouli:${project.patchouli_version}"

    testImplementation platform("org.junit:junit-bom:5.12.1")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.tomlj:tomlj:1.1.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

neoForge {
    enable {
        version = project.neo_version
        // The binary pipeline avoids a full Minecraft decompile/recompile in bounded builds.
        disableRecompilation = true
    }
    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        configureEach {
            jvmArgument '-Xmx1280m'
        }
    }
    mods {
        aura {
            sourceSet sourceSets.main
        }
    }
    unitTest {
        enable()
        testedMod = mods.aura
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("jar", Jar).configure {
    from("LICENSE")
}

tasks.named("sourcesJar", Jar).configure {
    from("LICENSE")
}

test {
    useJUnitPlatform()
    inputs.files('README.md', 'PORTING_NOTES.md', 'AuraCascade-592.jar')
    maxHeapSize = "512m"
    maxParallelForks = 1
}

// ModDevGradle sets this after evaluation; resource audits need the repository root.
afterEvaluate {
    tasks.named('test', Test).configure {
        workingDir = project.projectDir
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
